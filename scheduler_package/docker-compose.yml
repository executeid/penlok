services:
  scheduler-agent:
    build: .
    image: scheduler-agent:latest
    container_name: scheduler-agent
    restart: unless-stopped
    ports:
      - "8500:8500"
    env_file:
      - .env
    volumes:
      - ./scheduler_agent_xgb.pkl:/app/scheduler_agent_xgb.pkl
      - ./main.py:/app/main.py
