services:
  cloud-face-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-face-agent:latest
    container_name: cloud-face-agent
    restart: unless-stopped
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      - DB_HOST=10.1.1.186
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=penlok_cloud
      - SQLITE_FALLBACK_PATH=/home/penlok/app/cloud_task_log.db
      - YUNET_PATH=/home/penlok/app/face_detection_yunet_2023mar.onnx
      - EDGE_SYNC_URL=http://10.1.1.224:8600/api/v1/sync_user_face
    volumes:
      - ./gallery:/home/penlok/app/gallery
      - ./gallery_embeddings.pt:/home/penlok/app/gallery_embeddings.pt
      - ./cloud_task_log.db:/home/penlok/app/cloud_task_log.db
      - /home/penlok/.cache/torch:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
